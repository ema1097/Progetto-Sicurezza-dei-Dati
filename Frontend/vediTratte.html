<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratte Prenotate</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <button id="goHome" class="btn btn-danger">Home</button>
        </div>
    </nav>
    <div class="container mt-5">
        <h2>Tratte disponibili</h2>
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Partenza</th>
                    <th>Arrivo</th>
                    <th>Data</th>
                    <th>Importo (€)</th>
                    <th>Assegnata</th>
                </tr>
            </thead>
            <tbody id="tratte-table-body">
                <!-- Le tratte saranno inserite dinamicamente qui -->
            </tbody>
        </table>
        <a href="dashboard.html" class="btn btn-primary mt-3">Torna alla Dashboard</a>
    </div>

    <!-- Modale per la selezione degli autisti -->
    <div class="modal fade" id="autistiModal" tabindex="-1" role="dialog" aria-labelledby="autistiModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="autistiModalLabel">Seleziona un Autista</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <ul id="autisti-list" class="list-group">
                        <!-- Lista degli autisti disponibili sarà inserita dinamicamente qui -->
                    </ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Chiudi</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Carica le tratte dal server e popola la tabella
        function caricaTratte() {
            $.ajax({
                url: "http://127.0.0.1:3007/info/allTratte",
                type: "POST",
                success: function (response) {
                    if (response.success) {
                        console.log("Tratte recuperate:", response.message);
                        popolaTabella(response.message);
                    } else {
                        console.error("Errore nella risposta:", response.message);
                    }
                },
                error: function (xhr, status, error) {
                    console.error("Errore AJAX:", error);
                }
            });
        }

        // Popola la tabella con le tratte
        function popolaTabella(tratte) {
            const tableBody = document.getElementById('tratte-table-body');
            tableBody.innerHTML = ''; // Svuota la tabella

            if (tratte.length === 0) {
                const row = tableBody.insertRow();
                const cell = row.insertCell(0);
                cell.colSpan = 6;
                cell.textContent = 'Nessuna tratta disponibile.';
            } else {
                tratte.forEach((tratta, index) => {
                    const row = tableBody.insertRow();

                    // Colonna indice
                    row.insertCell(0).textContent = index + 1;

                    // Colonne Partenza, Arrivo, Data, Importo
                    row.insertCell(1).textContent = tratta.partenza;
                    row.insertCell(2).textContent = tratta.arrivo;
                    row.insertCell(3).textContent = tratta.data;
                    row.insertCell(4).textContent = tratta.pagamento;

                    // Colonna Assegnata
                    const cellAssegnata = row.insertCell(5);

                    if (tratta.assegnata) {
                        getAutistaAssegnato(tratta.id, cellAssegnata);
                    } else {
                        cellAssegnata.innerHTML = `
                            <button class="btn btn-success btn-sm" onclick="prenotaTratta(${index})">Assegna</button>
                        `;
                    }
                });
            }
        }

        // Recupera l'autista assegnato per una tratta
        function getAutistaAssegnato(trattaId, cell) {
            $.ajax({
                url: "http://127.0.0.1:3007/info/mostraTuttiIviaggi",
                type: "POST",
                success: function (response) {
                    if (response.success) {
                        const viaggio = response.message.find(item => item.tratta.id === trattaId);
                        if (viaggio) {
                            const { nome, cognome } = viaggio.autista;
                            cell.textContent = `${nome} ${cognome}`;
                        } else {
                            cell.textContent = "Errore nell'assegnazione.";
                        }
                    }
                },
                error: function (xhr, status, error) {
                    console.error("Errore AJAX:", error);
                }
            });
        }

        // Mostra il modal con gli autisti disponibili
        function prenotaTratta(trattaIndex) {
            let autistiList = document.getElementById('autisti-list'); // Elemento della lista nel modal

            // Svuota la lista degli autisti prima di popolarla
            autistiList.innerHTML = '';

            $.ajax({
                url: "http://127.0.0.1:3007/info/getAllAutistiDisponibile", // Endpoint per recuperare gli autisti
                type: "POST",
                success: function (response) {
                    if (response.message.length > 0) {
                        // Ordina gli autisti in base al numero di viaggi (crescentemente)
                        let autistiOrdinati = response.message.sort((a, b) => a.numeroViaggi - b.numeroViaggi);

                        autistiOrdinati.forEach(function (autista) {
                            console.log(autista);
                            let listItem = document.createElement('li');
                            listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
                            listItem.textContent = `${autista.nome} ${autista.cognome} (${autista.numeroViaggi} viaggi)`;

                            // Bottone per selezionare l'autista
                            let button = document.createElement('button');
                            button.className = 'btn btn-primary btn-sm';
                            button.textContent = 'Seleziona';

                            button.onclick = function () {
                                registraViaggio(trattaIndex + 1, autista.id); // Assegna la tratta all'autista selezionato
                            };

                            listItem.appendChild(button);
                            autistiList.appendChild(listItem);
                        });
                    } else {
                        // Se non ci sono autisti disponibili, mostra un messaggio
                        let listItem = document.createElement('li');
                        listItem.className = 'list-group-item';
                        listItem.textContent = 'Nessun autista disponibile';
                        autistiList.appendChild(listItem);
                    }
                },
                error: function (xhr, status, error) {
                    console.error("Errore durante la richiesta:", error);
                }
            });

            // Mostra il modal
            $('#autistiModal').modal('show');
        }

        // Registra un viaggio
        function registraViaggio(trattaIndex, autistaID) {
            const viaggio = {
                autistaAddress: autistaID,
                trattaId: trattaIndex,
                admin: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
            };

            $.ajax({
                url: "http://127.0.0.1:3007/registrazione/registraViaggio",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(viaggio),
                success: function (response) {
                    if (response.success) {
                        caricaTratte();
                        $('#autistiModal').modal('hide');
                    } else {
                        console.error("Errore durante la registrazione del viaggio:", response.message);
                    }
                },
                error: function (xhr, status, error) {
                    console.error("Errore AJAX:", error);
                }
            });
        }

        // Carica le tratte al caricamento della pagina
        window.onload = caricaTratte;
    </script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("goHome").addEventListener("click", function () {
            window.location.href = "dashboard.html";
        });
    </script>
</body>

</html>
