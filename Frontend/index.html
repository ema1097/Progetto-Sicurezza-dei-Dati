<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratte Disponibili</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    
        <a href="#logout" id="logoutButton" class="btn">Logout</a>
    

    <div class="container">
    

        <!-- Mostra nome e cognome dell'utente -->
        <h2 class="mt-5" id="titolo">Nome Cognome</h2> <!-- Verrà aggiornato con i dati dell'utente -->
    
        <h3 class="mt-5">Tratte Disponibili</h3>
        <div id="tratte-container" class="mt-3">
            <!-- Le tratte disponibili saranno visualizzate qui -->
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Recupera i dati utente dal localStorage
    const utente = JSON.parse(localStorage.getItem('userLogged')) || [];

    // Mostra il nome e cognome dell'utente
    document.getElementById('titolo').textContent = utente.nome + ' ' + utente.cognome;

    // Funzione per caricare e mostrare le tratte disponibili dal localStorage
    function caricaTratte() {
        let tratte = JSON.parse(localStorage.getItem('tratte')) || [];
        let tratteContainer = document.getElementById('tratte-container');
        
        // Svuota il contenitore prima di popolarlo
        tratteContainer.innerHTML = '';

        if (tratte.length === 0) {
            tratteContainer.innerHTML = '<p>Nessuna tratta disponibile.</p>';
        } else {
            tratte.forEach(function(tratta, index) {
                let trattaDiv = document.createElement('div');
                trattaDiv.classList.add('card', 'mb-3');
                
                let trattaBody = document.createElement('div');
                trattaBody.classList.add('card-body');
                
                // Dettagli tratta
                trattaBody.innerHTML = `
                    <h5 class="card-title">Tratta #${index + 1}</h5>
                    <p class="card-text">Partenza: ${tratta.partenza}</p>
                    <p class="card-text">Arrivo: ${tratta.arrivo}</p>
                    <p class="card-text">Data: ${tratta.data}</p>
                    <p class="card-text">Importo: €${tratta.importo.toFixed(2)}</p>
                    <p class="card-text">Assegnata: ${tratta.assegnata ? 'Sì' : 'No'}</p>
                    <button class="btn btn-success" onclick="prenotaTratta(${index})">Prenotati</button>
                `;
                
                trattaDiv.appendChild(trattaBody);
                tratteContainer.appendChild(trattaDiv);
            });
        }
    }

    // Funzione per prenotarsi ad una tratta
    function prenotaTratta(index) {
        let tratte = JSON.parse(localStorage.getItem('tratte')) || [];
        
        if (tratte[index].assegnata) {
            alert('Questa tratta è già assegnata.');
        } else {
            tratte[index].assegnata = true;  // Segna la tratta come assegnata
            localStorage.setItem('tratte', JSON.stringify(tratte));
            alert('Prenotazione avvenuta con successo per la tratta #' + (index + 1));
            caricaTratte(); // Ricarica le tratte per aggiornare lo stato
        }
    }

    // Carica le tratte disponibili al caricamento della pagina
    window.onload = caricaTratte;
</script>
<script src="script.js"></script>

</body>
</html>
