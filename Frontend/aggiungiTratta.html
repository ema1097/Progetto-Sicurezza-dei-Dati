<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Aggiungi tratta</h1>
    
        <form id="aggiungiTrattaForm">
            <label for="partenza">Partenza:</label>
            <input type="text" id="partenza" name="partenza" placeholder="Inserisci la città di partenza" required>
    
            <label for="arrivo">Arrivo:</label>
            <input type="text" id="arrivo" name="arrivo" placeholder="Inserisci la città di arrivo" required>
    
            <label for="data">Data di Viaggio:</label>
            <input type="date" id="data" name="data" required>
    
            <label for="pagamento">Importo del Pagamento (in €):</label>
            <input type="number" id="pagamento" name="pagamento" placeholder="Inserisci l'importo" min="0" step="0.01" required>
    
            <button type="submit">Aggiungi</button>
        </form>
    </div>
    
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>
