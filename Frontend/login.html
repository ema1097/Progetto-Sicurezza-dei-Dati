<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2 class="mt-5">Login</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
        <button type="button" id="show-storage" class="btn btn-secondary ml-2">Mostra Storage</button>
        <button type="button" id="clear-storage" class="btn btn-danger ml-2">Cancella Storage</button>
    </form>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("show-storage").addEventListener("click", function() {
        console.log("Session Storage:", sessionStorage);
        console.log("Local Storage:", localStorage);
    });
    
    document.getElementById("clear-storage").addEventListener("click", function() {
        sessionStorage.clear();
        localStorage.clear();
        console.log("Storage cancellato");
    });
</script>

<script src="script.js"></script>

</body>
</html>
