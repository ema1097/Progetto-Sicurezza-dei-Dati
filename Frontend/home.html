<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo Utente</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="navbar">
        <a href="#" id="logoutButton" class="btn">Logout</a>
    </div>

    <div class="profile-container">
        <div class="profile-header">
            <h2 id="welcomeMessage">Benvenuto!</h2>
        </div>
        <div class="profile-details">
            <p><strong>My id:</strong> <span id="myId">Nome Utente</span></p>
            <p><strong>Email:</strong> <span id="profileEmail">email@esempio.com</span></p>
            <p><strong>Viaggi effettuati:</strong> <span id="viaggi">Viaggi</span></p>
            <p><strong>Disponibilità:</strong> <span id="disponibilita">Disponibilità</span></p>
        </div>
        <div class="action-buttons">
            <button id="btnCandidati" class="btn btn-candidati">Candidati</button>
            <button id="btnRimuovi" class="btn btn-rimuovi">Rimuovi Disponibilità</button>
        </div>
    </div>

    <!-- Sezione Tabella Viaggi Effettuati -->
    <div class="travel-table">
        <h3>Viaggi Effettuati</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Partenza</th>
                    <th>Arrivo</th>
                    <th>Data</th>
                    <th>Importo</th>
                </tr>
            </thead>
            <tbody id="viaggiEffettuatiTableBody">
                <!-- I viaggi effettuati verranno popolati qui -->
            </tbody>
        </table>
    </div>

    <!-- Sezione Tabella Viaggi Da Effettuare -->
    <div class="travel-table">
        <h3>Viaggi Da Effettuare</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Partenza</th>
                    <th>Arrivo</th>
                    <th>Data</th>
                    <th>Importo</th>
                </tr>
            </thead>
            <tbody id="viaggiDaEffettuareTableBody">
                <!-- I viaggi da effettuare verranno popolati qui -->
            </tbody>
        </table>
    </div>

    <script>
        // Simula il recupero dell'utente dal sessionStorage
        document.addEventListener('DOMContentLoaded', function() {
            const loggedInUser = JSON.parse(sessionStorage.getItem('loggedUser'));

            if (loggedInUser) {
                // Mostra i dati dell'utente nella pagina del profilo
                document.getElementById('welcomeMessage').textContent = 'Benvenuto, ' + loggedInUser.nome + ' ' + loggedInUser.cognome;
                document.getElementById('myId').textContent = loggedInUser.autistaAddress;
                document.getElementById('profileEmail').textContent = loggedInUser.email;
                document.getElementById('viaggi').textContent = loggedInUser.numViaggi;
                if (loggedInUser.disponibilita) {
                    document.getElementById('disponibilita').textContent = 'Si';
                } else {
                    document.getElementById('disponibilita').textContent = 'No';
                }

                // Otteniamo la data odierna
                const oggi = new Date();

                // Chiamata AJAX per recuperare i viaggi effettuati
                $.ajax({
                    url: 'http://127.0.0.1:3007/info/mostraTuttiIviaggiAutista', // Endpoint dell'API
                    method: 'POST', // Tipo di richiesta
                    contentType: "application/json",
                    data: JSON.stringify({ autistaAddress: loggedInUser.autistaAddress }), // Invia l'indirizzo dell'autista come JSON
                    success: function(response) {
                        const viaggi = response.message; // Risposta con i viaggi
                        const tableBodyEffettuati = document.getElementById('viaggiEffettuatiTableBody');
                        const tableBodyDaEffettuare = document.getElementById('viaggiDaEffettuareTableBody');
                        
                        let progressivoIdEffettuati = 1;  // Variabile per i viaggi effettuati
                        let progressivoIdDaEffettuare = 1;  // Variabile per i viaggi da effettuare

                        // Separiamo i viaggi in due categorie in base alla data
                        viaggi.forEach(function(item) {
                            const tratta = item.tratta;
                            const dataViaggio = new Date(tratta.data); // Converti la data del viaggio in un oggetto Date

                            const row = document.createElement('tr');

                            if (dataViaggio < oggi) {
                                // Viaggio già effettuato (data precedente a oggi)
                                row.innerHTML = `
                                    <td>${progressivoIdEffettuati}</td>
                                    <td>${tratta.partenza}</td>
                                    <td>${tratta.arrivo}</td>
                                    <td>${tratta.data}</td>
                                    <td>${tratta.pagamento}€</td>
                                `;
                                tableBodyEffettuati.appendChild(row);
                                progressivoIdEffettuati++;
                            } else {
                                // Viaggio da effettuare (data futura o uguale a oggi)
                                row.innerHTML = `
                                    <td>${progressivoIdDaEffettuare}</td>
                                    <td>${tratta.partenza}</td>
                                    <td>${tratta.arrivo}</td>
                                    <td>${tratta.data}</td>
                                    <td>${tratta.pagamento}€</td>
                                `;
                                tableBodyDaEffettuare.appendChild(row);
                                progressivoIdDaEffettuare++;
                            }
                        });
                    },
                    error: function(xhr, status, error) {
                        console.error('Errore nella richiesta AJAX:', error);
                    }
                });
            } else {
                // Se non c'è nessun utente loggato, reindirizza alla pagina di login
                window.location.href = 'login.html';
            }

            // Gestione del logout
            document.getElementById('logoutButton').addEventListener('click', function() {
                sessionStorage.removeItem('loggedUser');
                window.location.href = 'login.html'; // Reindirizza alla pagina di login
            });
        });
    </script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
